# Search engines to use — DuckDuckGo only (Playwright/Google/Bing removed)
SEARCH_ENGINES:
  - duckduckgo

# Results per query per engine
MAX_RESULTS_PER_QUERY: 25

# Delay between requests (seconds)
REQUEST_DELAY: 2

# Minimum score to keep a result
MIN_SCORE: 1

# Domains to EXCLUDE from results
EXCLUDE_DOMAINS:
  - google.com
  - googleapis.com
  - gstatic.com
  - youtube.com
  - facebook.com
  - twitter.com
  - x.com
  - instagram.com
