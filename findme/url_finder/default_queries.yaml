# =============================================================================
# SCRAPER CONFIG
# =============================================================================
# Change THIS variable to scrape a different location.
# =============================================================================

LOCATION: "Atlanta, Georgia"

# Target unique results — scraper retries up to MAX_RETRIES times if under this
MIN_UNIQUE_RESULTS: 500
MAX_RETRIES: 3

# Search queries - many variations to maximize unique results
# {location} is replaced with the LOCATION value above.
SEARCH_QUERIES:
  # Core queries
  - "real estate company {location}"
  - "realty company {location}"
  - "real estate brokerage {location}"
  - "property management company {location}"
  - "real estate agency {location}"
  - "commercial real estate company {location}"
  - "residential real estate company {location}"
  - "real estate developer {location}"
  - "property dealer {location}"
  - "real estate firm {location}"
  # Neighborhood / area variants
  - "real estate agents {location}"
  - "realtors {location}"
  - "real estate brokers {location}"
  - "home buyers company {location}"
  - "property investors {location}"
  # Industry-specific
  - "luxury real estate {location}"
  - "apartment rental company {location}"
  - "commercial property management {location}"
  - "real estate consulting firm {location}"
  - "land development company {location}"
  # Action-oriented
  - "sell my house {location}"
  - "buy property {location}"
  - "real estate listings {location}"
  - "new construction homes {location}"
  - "property appraisal company {location}"
  # Additional coverage queries
  - "estate agents {location}"
  - "property services {location}"
  - "residential real estate {location}"
  - "property sales agency {location}"
  - "house sales agents {location}"
  - "commercial property agency {location}"
  - "commercial property company {location}"
  - "commercial leasing agents {location}"
  - "property management agency {location}"
  - "property managers {location}"
  - "rental property management {location}"
  - "rental management agency {location}"
  - "property investment company {location}"
  - "real estate investment company {location}"
  - "property investment advisory {location}"
  - "luxury property agents {location}"
  - "waterfront property agents {location}"
  - "real estate developer {location}"
  - "property developer {location}"
  - "property development company {location}"
  - "land development company {location}"
  - "apartment rental agency {location}"
  - "residential leasing agents {location}"
  - "property appraisal company {location}"
  - "property valuation company {location}"
  - "real estate consulting firm {location}"
  - "property consultants {location}"
  - "real estate advisory {location}"
  - "local real estate agents {location}"
  - "best real estate agents {location}"
  - "independent real estate agency {location}"
  - "family owned real estate agency {location}"
  - "boutique real estate agency {location}"
  - "property specialists {location}"
  - "new homes {location}"
  - "new developments {location}"

# Search engines to use
SEARCH_ENGINES:
  - duckduckgo

# Results per query per engine
MAX_RESULTS_PER_QUERY: 25

# Delay between requests (seconds)
REQUEST_DELAY: 2

# Minimum score to keep a result
MIN_SCORE: 1

# Domains to EXCLUDE from results
EXCLUDE_DOMAINS:
  - google.com
  - googleapis.com
  - gstatic.com
  - youtube.com
  - facebook.com
  - twitter.com
  - x.com
  - instagram.com
  - linkedin.com
  - yelp.com
  - wikipedia.org
  - bing.com
  - duckduckgo.com
  - craigslist.org
  - indeed.com
  - glassdoor.com
  - mapquest.com
  - maps.google.com
  - apple.com
  - microsoft.com
  - reddit.com
